<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="976" viewBox="0 0 1190 976"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Nunito Sans","Segoe UI",Arial,sans-serif;fill:#3a1c3f;font-size:15px}
.s{font-size:13px;fill:#2a2230} .b{font-weight:700} .c{text-anchor:middle}</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#3a1c3f"/></marker></defs><text x="595.0" y="22" class="c b" style="font-size:19px">Sequence diagram: adding to cart, checkout and confirmation</text><rect x="10" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="90" y="71" class="c b" style="fill:#fff;font-size:14px">Customer</text><line x1="90" y1="92" x2="90" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><rect x="210" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="290" y="58" class="c b" style="fill:#fff;font-size:14px">Product page</text><text x="290" y="75" class="c b" style="fill:#fff;font-size:14px">(main.js)</text><line x1="290" y1="92" x2="290" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><rect x="410" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="490" y="58" class="c b" style="fill:#fff;font-size:14px">Cart</text><text x="490" y="75" class="c b" style="fill:#fff;font-size:14px">(cart.js)</text><line x1="490" y1="92" x2="490" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><rect x="610" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="690" y="71" class="c b" style="fill:#fff;font-size:14px">localStorage</text><line x1="690" y1="92" x2="690" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><rect x="810" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="890" y="58" class="c b" style="fill:#fff;font-size:14px">Checkout</text><text x="890" y="75" class="c b" style="fill:#fff;font-size:14px">(checkout.js)</text><line x1="890" y1="92" x2="890" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><rect x="1010" y="40" width="160" height="52" rx="10" fill="#3a1c3f"/><text x="1090" y="58" class="c b" style="fill:#fff;font-size:14px">Confirmation</text><text x="1090" y="75" class="c b" style="fill:#fff;font-size:14px">page</text><line x1="1090" y1="92" x2="1090" y2="956" stroke="#6f6577" stroke-dasharray="6 5"/><line x1="90" y1="120" x2="286" y2="120" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="190.0" y="112" class="s c">1. click "Add to cart"</text><line x1="290" y1="168" x2="486" y2="168" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="390.0" y="160" class="s c">2. addToCart(id)</text><line x1="490" y1="216" x2="686" y2="216" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="590.0" y="208" class="s c">3. save cart</text><line x1="490" y1="264" x2="94" y2="264" stroke="#3a1c3f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="290.0" y="256" class="s c">4. toast + cart badge updated</text><line x1="90" y1="312" x2="486" y2="312" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="290.0" y="304" class="s c">5. open cart page</text><line x1="490" y1="360" x2="686" y2="360" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="590.0" y="352" class="s c">6. read cart</text><line x1="490" y1="408" x2="94" y2="408" stroke="#3a1c3f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="290.0" y="400" class="s c">7. show items, subtotal, shipping, total</text><line x1="90" y1="456" x2="486" y2="456" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="290.0" y="448" class="s c">8. change quantity / apply promo code</text><line x1="490" y1="504" x2="686" y2="504" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="590.0" y="496" class="s c">9. save changes</text><line x1="90" y1="552" x2="886" y2="552" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="490.0" y="544" class="s c">10. fill the form, press "Place order"</text><path d="M890 592 h46 v22 h-46" fill="none" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="946" y="606" class="s">11. validate every field</text><line x1="890" y1="648" x2="94" y2="648" stroke="#3a1c3f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="490.0" y="640" class="s c">12. [invalid] show error messages</text><line x1="890" y1="696" x2="694" y2="696" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="790.0" y="688" class="s c">13. [valid] save order (no card data)</text><line x1="890" y1="744" x2="494" y2="744" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="690.0" y="736" class="s c">14. clearCart()</text><line x1="890" y1="792" x2="1086" y2="792" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="990.0" y="784" class="s c">15. redirect to confirmation.html</text><line x1="1090" y1="840" x2="694" y2="840" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="890.0" y="832" class="s c">16. read last order</text><line x1="1090" y1="888" x2="94" y2="888" stroke="#3a1c3f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="590.0" y="880" class="s c">17. show order number and summary</text></svg>