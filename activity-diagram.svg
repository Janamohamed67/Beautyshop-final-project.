<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#3a1c3f"/></marker></defs><text x="380.0" y="26" class="c b" style="font-size:19px">Activity diagram: buying a product</text><circle cx="330" cy="52" r="11" fill="#3a1c3f"/><line x1="330" y1="63" x2="330" y2="82" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="185.0" y="84" width="290" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="111.0" class="c s">Browse products and open a product</text><line x1="330" y1="128" x2="330" y2="148" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="185.0" y="150" width="290" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="177.0" class="c s">Press "Add to cart"</text><line x1="330" y1="194" x2="330" y2="214" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="185.0" y="216" width="290" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="243.0" class="c s">Open the cart page</text><line x1="330" y1="260" x2="330" y2="280" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><polygon points="330,282 455.0,314.0 330,346 205.0,314.0" fill="#fbeef0" stroke="#d8456b" stroke-width="1.8"/><text x="330" y="319.0" class="c s b">Cart empty?</text><path d="M455 314 H640 V150 H475" fill="none" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="465" y="306" class="s b" style="fill:#d8456b">yes</text><text x="650" y="262" class="s" style="text-anchor:end">go back and add products</text><line x1="330" y1="346" x2="330" y2="372" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="338" y="366" class="s b" style="fill:#d8456b">no</text><rect x="160.0" y="374" width="340" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="401.0" class="c s">Change quantity, remove items, apply promo code</text><line x1="330" y1="418" x2="330" y2="438" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="160.0" y="440" width="340" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="467.0" class="c s">Totals recalculated (subtotal, discount, shipping)</text><line x1="330" y1="484" x2="330" y2="504" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="160.0" y="506" width="340" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="533.0" class="c s">Press "Go to checkout"</text><line x1="330" y1="550" x2="330" y2="570" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="160.0" y="572" width="340" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="599.0" class="c s">Enter delivery details and choose payment method</text><line x1="330" y1="616" x2="330" y2="636" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><polygon points="330,638 455.0,670.0 330,702 205.0,670.0" fill="#fbeef0" stroke="#d8456b" stroke-width="1.8"/><text x="330" y="675.0" class="c s b">Fields valid?</text><path d="M205 670 H60 V594 H160" fill="none" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="162" y="662" class="s b" style="fill:#d8456b">no</text><text x="66" y="632" class="s">show errors, user corrects</text><line x1="330" y1="702" x2="330" y2="728" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><text x="338" y="722" class="s b" style="fill:#d8456b">yes</text><rect x="185.0" y="730" width="290" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="757.0" class="c s">Place order</text><line x1="330" y1="774" x2="330" y2="794" stroke="#3a1c3f" stroke-width="1.8" marker-end="url(#a)"/><rect x="160.0" y="796" width="340" height="44" rx="14" fill="#f4eef7" stroke="#3a1c3f" stroke-width="1.6"/><text x="330" y="823.0" class="c s">Save order in localStorage and empty the cart</text><line x1=