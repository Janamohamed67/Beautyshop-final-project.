<svg xmlns="http://www.w3.org/2000/svg" width="760" height="985" viewBox="0 0 760 985"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Nunito Sans","Segoe UI",Arial,sans-serif;fill:#3a1c3f;font-size:15px}
